model:
  num_classes: 4
  pretrained: true
  dropout_rate: 0.3

training:
  epochs: 30
  batch_size: 32
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  weight_decay: 1.0e-4
  early_stopping_patience: 5

optimizer: adamw

loss:
  type: focal
  gamma: 2.0

data:
  image_size: 224
  num_workers: 4
  pin_memory: true
