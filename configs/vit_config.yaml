model:
  num_classes: 4
  use_flash_attention: true
  patch_size: 16
  image_size: 224
  pretrained: true

training:
  epochs: 30
  batch_size: 16       # Smaller than ResNet due to higher memory
  learning_rate: 1.0e-4
  warmup_epochs: 10    # ViT needs warmup — raw training is unstable
  lr_scheduler: cosine
  weight_decay: 0.05   # Higher than ResNet — ViT overfits more
  dropout: 0.1
  early_stopping_patience: 5

optimizer: adamw

loss:
  type: focal
  gamma: 2.0

data:
  image_size: 224
  num_workers: 4
  pin_memory: true

distributed:
  backend: nccl
  num_gpus: 1          # Change to 4 or 8 for multi-GPU
