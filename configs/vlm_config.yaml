vision_encoder:
  name: vit_base_patch16_224
  pretrained_checkpoint: outputs/vit/best_model.pt
  freeze: true

projection:
  input_dim: 768
  output_dim: 4096
  hidden_dim: 2048
  dropout: 0.1

llm:
  name: mistralai/Mistral-7B-v0.1
  lora:
    rank: 16
    alpha: 32
    target_modules: [q_proj, v_proj]
    dropout: 0.05

training:
  epochs: 10
  batch_size: 4
  learning_rate: 2.0e-4
  lr_scheduler: cosine_warmup
  warmup_steps: 100
  weight_decay: 0.01
  gradient_accumulation_steps: 8
  max_seq_length: 512

optimizer: adamw

data:
  image_size: 224
  num_workers: 4
